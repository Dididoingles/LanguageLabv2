<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Linguistic Command Center | Mars Nexus</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@100;400;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Anime.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <style>
        /* ============================================================
           1. VARIÁVEIS GLOBAIS
           ============================================================ */
        :root {
            /* Cores */
            --f-red: #c20000;
            --f-black: #000000;
            --f-gray: #888888;
            --f-light-gray: #cccccc;
            --f-word: #333333;

            /* Fontes */
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Tamanhos base */
            --fs-base: 16px;
            --fs-bg-word: 0.8rem;
            --fs-bg-word-mobile: 0.5rem;

            /* Espaçamentos */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-12: 3rem;

            /* HUD */
            --hud-size: 40px;
            --hud-offset: 2rem;
            --hud-border: 2px;

            /* Transições */
            --t-fast: 0.3s ease;
            --t-fade: 0.8s cubic-bezier(0.23, 1, 0.32, 1);

            /* Raio / formas */
            --radius-full: 9999px;
        }

        /* ============================================================
           2. RESET / BASE
           ============================================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--f-black);
            color: #ffffff;
            overflow: hidden;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background-color: var(--f-red);
            color: #ffffff;
        }

        a { text-decoration: none; color: inherit; }

        /* ============================================================
           3. CANVAS 3D
           ============================================================ */
        #webgl-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ============================================================
           4. CONTAINER DE PALAVRAS DE FUNDO
           ============================================================ */
        #bg-words-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* ============================================================
           5. HUD BRACKETS (cantos vermelhos)
           ============================================================ */
        .hud-bracket {
            position: absolute;
            width: var(--hud-size);
            height: var(--hud-size);
            border-color: var(--f-red);
            z-index: 10;
            opacity: 0;
            display: none; /* escondido por padrão (mobile) */
        }

        @media (min-width: 768px) {
            .hud-bracket { display: block; }

            .bracket-tl { top: var(--hud-offset); left: var(--hud-offset);  border-top: var(--hud-border) solid; border-left: var(--hud-border) solid; }
            .bracket-tr { top: var(--hud-offset); right: var(--hud-offset); border-top: var(--hud-border) solid; border-right: var(--hud-border) solid; }
            .bracket-bl { bottom: var(--hud-offset); left: var(--hud-offset);  border-bottom: var(--hud-border) solid; border-left: var(--hud-border) solid; }
            .bracket-br { bottom: var(--hud-offset); right: var(--hud-offset); border-bottom: var(--hud-border) solid; border-right: var(--hud-border) solid; }
        }

        /* ============================================================
           6. LAYOUT PRINCIPAL (main-container)
           ============================================================ */
        .main-container {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: var(--space-4);
            pointer-events: none;
        }

        @media (min-width: 768px) {
            .main-container { padding: var(--space-8); }
        }

        @media (min-width: 1024px) {
            .main-container { padding: var(--space-12); }
        }

        /* ============================================================
           7. HEADER
           ============================================================ */
        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            pointer-events: auto;
            opacity: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        @media (min-width: 768px) {
            .header-left { gap: var(--space-3); }
        }

        .mic-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid var(--f-red);
            border-radius: var(--radius-full);
            background-color: var(--f-black);
            overflow: hidden;
            cursor: pointer;
            transition: border-color var(--t-fast);
        }

        @media (min-width: 768px) {
            .mic-icon-wrap { width: 2.5rem; height: 2.5rem; }
        }

        .mic-icon-wrap:hover { border-color: #ffffff; }

        .mic-icon-wrap svg {
            width: 1rem;
            height: 1rem;
            color: var(--f-red);
            transition: color var(--t-fast);
        }

        @media (min-width: 768px) {
            .mic-icon-wrap svg { width: 1.25rem; height: 1.25rem; }
        }

        .mic-icon-wrap:hover svg { color: #ffffff; }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .header-title-primary {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--f-red);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            .header-title-primary { font-size: 0.75rem; letter-spacing: 0.2em; }
        }

        .header-title-secondary {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--f-gray);
        }

        @media (min-width: 768px) {
            .header-title-secondary { font-size: 10px; }
        }

        .header-right {
            display: none;
            text-align: right;
        }

        @media (min-width: 640px) {
            .header-right { display: block; }
        }

        .header-proto {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            color: #ffffff;
        }

        @media (min-width: 768px) {
            .header-proto { font-size: 0.875rem; }
        }

        .header-status {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--f-red);
            margin-top: 0.125rem;
        }

        @media (min-width: 768px) {
            .header-status { font-size: 0.75rem; margin-top: 0.25rem; }
        }

        /* ============================================================
           8. CONTEÚDO PRINCIPAL
           ============================================================ */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 64rem;
            margin: 0 auto;
            width: 100%;
            pointer-events: auto;
            padding: 0 var(--space-4);
        }

        @media (min-width: 768px) {
            .main-content { padding: 0; }
        }

        /* --- Badge --- */
        .ui-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: 0.125rem var(--space-2);
            margin-bottom: var(--space-3);
            border: 1px solid rgba(194, 0, 0, 0.3);
            background-color: rgba(194, 0, 0, 0.1);
            border-radius: var(--radius-full);
            opacity: 0;
        }

        .ui-badge svg {
            width: 0.75rem;
            height: 0.75rem;
            color: var(--f-red);
        }

        .ui-badge span {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--f-light-gray);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @media (min-width: 768px) {
            .ui-badge {
                gap: var(--space-2);
                padding: 0.25rem var(--space-3);
                margin-bottom: var(--space-4);
            }
            .ui-badge svg { width: 1rem; height: 1rem; }
            .ui-badge span { font-size: 0.75rem; }
        }

        /* --- Título H1 --- */
        .ui-title {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1.1;
            margin-bottom: var(--space-2);
            text-transform: uppercase;
            position: relative;
        }

        @media (min-width: 641px) {
            .ui-title { font-size: 2.25rem; }
        }

        @media (min-width: 768px) {
            .ui-title { font-size: 3.5rem; margin-bottom: var(--space-6); }
        }

        @media (min-width: 1024px) {
            .ui-title { font-size: 4.5rem; }
        }

        #scramble-title-main {
            display: inline-block;
            position: relative;
            background: linear-gradient(to right, var(--f-light-gray), #ffffff, var(--f-red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.2s ease;
        }

        #scramble-title-main.reveal-title {
            visibility: visible;
            opacity: 1;
        }

        #title-line {
            position: absolute;
            bottom: -0.5rem;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--f-red);
            transform: scaleX(0);
            transform-origin: left;
        }

        /* --- Descrição --- */
        .ui-desc {
            color: var(--f-gray);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: -0.06rem;
            max-width: 42rem;
            margin-bottom: var(--space-6);
            padding: 0 var(--space-2);
            opacity: 0;
        }

        @media (min-width: 641px) {
            .ui-desc { font-size: 1rem; }
        }

        @media (min-width: 768px) {
            .ui-desc {
                margin-bottom: var(--space-12);
                padding: 0;
            }
        }

        @media (min-width: 1024px) {
            .ui-desc { font-size: 1.25rem; }
        }

        /* --- Botão CTA --- */
        .cta-button {
            position: relative;
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 0.625rem 1.25rem;
            background-color: var(--f-black);
            border: 2px solid var(--f-red);
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            outline: none;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: all var(--t-fast);
        }

        @media (min-width: 641px) {
            .cta-button {
                padding: 0.75rem 1.5rem;
            }
        }

        @media (min-width: 768px) {
            .cta-button {
                gap: var(--space-3);
                padding: 1.25rem 2.5rem;
                font-size: 0.875rem;
                letter-spacing: 0.2em;
            }
        }

        .cta-button:hover {
            box-shadow: 0 0 20px rgba(194, 0, 0, 0.6);
            transform: scale(1.02);
        }

        .cta-button-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: var(--f-red);
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 0;
        }

        .cta-button:hover .cta-button-bg { transform: translateX(0); }

        /* Ícone (Lucide renderiza <svg> dentro do botão) */
        .cta-button svg,
        .cta-button i {
            width: 1rem;
            height: 1rem;
            position: relative;
            z-index: 10;
            color: var(--f-red);
            transition: color var(--t-fast);
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .cta-button svg,
            .cta-button i { width: 1.25rem; height: 1.25rem; }
        }

        .cta-button:hover svg,
        .cta-button:hover i { color: var(--f-black); }

        /* Texto do botão (apenas spans diretos, exceto o fundo) */
        .cta-button > span:not(.cta-button-bg) {
            position: relative;
            z-index: 10;
            font-weight: 700;
            color: #ffffff;
            transition: color var(--t-fast);
        }

        .cta-button:hover > span:not(.cta-button-bg) { color: var(--f-black); }

        /* ============================================================
           9. FOOTER
           ============================================================ */
        .ui-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: auto;
            opacity: 0;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 0.125rem;
        }

        @media (min-width: 768px) {
            .footer-left { gap: var(--space-1); }
        }

        .footer-target {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--f-gray);
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        @media (min-width: 768px) {
            .footer-target { font-size: 0.75rem; gap: var(--space-2); }
        }

        .footer-target svg {
            width: 0.5rem;
            height: 0.5rem;
            color: var(--f-red);
        }

        @media (min-width: 768px) {
            .footer-target svg { width: 0.75rem; height: 0.75rem; }
        }

        .footer-target-value {
            color: #ffffff;
            font-size: 0.65rem;
        }

        @media (min-width: 768px) {
            .footer-target-value { font-size: 0.75rem; }
        }

        .footer-coords {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: rgba(194, 0, 0, 0.7);
        }

        @media (min-width: 768px) {
            .footer-coords { font-size: 10px; }
        }

        .footer-icons {
            display: flex;
            gap: var(--space-3);
        }

        @media (min-width: 768px) {
            .footer-icons { gap: var(--space-4); }
        }

        .footer-icons a {
            color: var(--f-gray);
            transition: color var(--t-fast);
        }

        .footer-icons a:hover { color: var(--f-red); }

        .footer-icons svg {
            width: 1rem;
            height: 1rem;
        }

        @media (min-width: 768px) {
            .footer-icons svg { width: 1.25rem; height: 1.25rem; }
        }

        /* ============================================================
           10. PALAVRAS DE FUNDO FLUTUANTES
           ============================================================ */
        .bg-word {
            position: absolute;
            font-family: var(--font-mono);
            color: var(--f-word);
            font-size: var(--fs-bg-word-mobile);
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
        }

        @media (min-width: 641px) {
            .bg-word { font-size: var(--fs-bg-word); }
        }

        /* ============================================================
           11. OVERLAY DE FADE
           ============================================================ */
        #fade-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--t-fade);
        }

        /* ============================================================
           12. CARACTERES DO SCRAMBLE (efeito de texto embaralhado)
           ============================================================ */
        .scramble-char {
            color: var(--f-red);
        }
    </style>
</head>

<body>
    <div id="fade-overlay"></div>
    <div id="webgl-container"></div>
    <div id="bg-words-container"></div>

    <!-- HUD brackets -->
    <div class="hud-bracket bracket-tl"></div>
    <div class="hud-bracket bracket-tr"></div>
    <div class="hud-bracket bracket-bl"></div>
    <div class="hud-bracket bracket-br"></div>

    <div class="main-container">

        <!-- HEADER -->
        <header class="ui-header" id="ui-header">
            <div class="header-left">
                <div class="mic-icon-wrap">
                    <i data-lucide="mic"></i>
                </div>
                <div class="header-titles">
                    <span class="header-title-primary">Comms Status</span>
                    <span class="header-title-secondary">CHANNEL: OPEN / ENCRYPTED</span>
                </div>
            </div>

            <div class="header-right">
                <div class="header-proto">Mars_protocol // V.9.2</div>
                <div class="header-status">SYSTEM NOMINAL</div>
            </div>
        </header>

        <!-- MAIN -->
        <main class="main-content">
            <div class="ui-badge" id="ui-badge">
                <i data-lucide="satellite"></i>
                <span id="scramble-badge">Mars Linguistic Protocol Active</span>
            </div>

            <h1 class="ui-title">
                <span id="scramble-title-main">
                    Welcome to Mars
                    <span id="title-line"></span>
                </span>
            </h1>

            <p class="ui-desc" id="ui-desc">
                Bem-vindo ao Language Lab! Tudo aqui foi pensado para você. Clique em 'Start' para começar a sua jornada.
            </p>

            <button class="cta-button" id="cta-button">
                <span class="cta-button-bg"></span>
                <i data-lucide="rocket"></i>
                <span>Start</span>
            </button>
        </main>

        <!-- FOOTER -->
        <footer class="ui-footer" id="ui-footer">
            <div class="footer-left">
                <div class="footer-target">
                    <i data-lucide="crosshair"></i>
                    <span class="target-word-label">TARGET LOCK:</span>
                    <span class="footer-target-value" id="target-word">MARS LINGUISTICS</span>
                </div>
                <div class="footer-coords" id="coordinates">TRACKING: MARS ROTATION</div>
            </div>
            <div class="footer-icons">
                <a href="#"><i data-lucide="terminal"></i></a>
                <a href="#"><i data-lucide="cpu"></i></a>
            </div>
        </footer>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.0012);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 16);

        const renderer = new THREE.WebGLRenderer({ alpha: false, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x331100);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffaa77, 1.4);
        mainLight.position.set(5, 5, 7);
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0xaa6644, 0.4);
        fillLight.position.set(-3, 2, 4);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0xff8866, 0.25);
        backLight.position.set(0, 2, -6);
        scene.add(backLight);

        const textureLoader = new THREE.TextureLoader();
        const marsMap = textureLoader.load('https://threejs.org/examples/textures/planets/mars.jpg');
        const marsNormalMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');

        const marsGeometry = new THREE.SphereGeometry(5, 128, 128);
        const marsMaterial = new THREE.MeshPhongMaterial({
            map: marsMap,
            color: 0xcc8866,
            emissive: 0x331100,
            emissiveIntensity: 0.15,
            shininess: 30,
            normalMap: marsNormalMap,
            normalScale: new THREE.Vector2(0.6, 0.6)
        });
        const mars = new THREE.Mesh(marsGeometry, marsMaterial);
        scene.add(mars);

        const atmosphereGeometry = new THREE.SphereGeometry(5.08, 128, 128);
        const atmosphereMaterial = new THREE.MeshPhongMaterial({
            color: 0xcc6644,
            transparent: true,
            opacity: 0.08,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        const dustCount = 800;
        const dustGeometry = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            const radius = 5.5 + Math.random() * 0.8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            dustPositions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
            dustPositions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
            dustPositions[i*3+2] = radius * Math.cos(phi);
        }
        dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMaterial = new THREE.PointsMaterial({
            color: 0xcc8866, size: 0.03, transparent: true,
            opacity: 0.3, blending: THREE.AdditiveBlending
        });
        const dustParticles = new THREE.Points(dustGeometry, dustMaterial);
        scene.add(dustParticles);

        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 400;
            starPositions[i*3+1] = (Math.random() - 0.5) * 200;
            starPositions[i*3+2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        const starGeometry2 = new THREE.BufferGeometry();
        const starCount2 = 1200;
        const starPositions2 = new Float32Array(starCount2 * 3);
        for (let i = 0; i < starCount2; i++) {
            starPositions2[i*3] = (Math.random() - 0.5) * 600;
            starPositions2[i*3+1] = (Math.random() - 0.5) * 300;
            starPositions2[i*3+2] = (Math.random() - 0.5) * 150 - 80;
        }
        starGeometry2.setAttribute('position', new THREE.BufferAttribute(starPositions2, 3));
        const starMaterial2 = new THREE.PointsMaterial({ color: 0xffaa88, size: 0.08, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
        const stars2 = new THREE.Points(starGeometry2, starMaterial2);
        scene.add(stars2);

        let mouseX = 0, mouseY = 0;
        let targetRotY = 0, targetRotX = 0;
        let currentRotY = 0, currentRotX = 0;

        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = (event.clientY / window.innerHeight) * 2 - 1;
            targetRotY = mouseX * 1.5;
            targetRotX = mouseY * 0.6;

            const coordElem = document.getElementById('coordinates');
            if (coordElem) {
                coordElem.innerText = `LAT: ${((mouseY * 90).toFixed(1))}° | LON: ${((mouseX * 180).toFixed(1))}° | PLANET: MARS`;
            }
        });

        let starSpeed = 0.006;

        const ctaBtn = document.getElementById('cta-button');
        ctaBtn.addEventListener('mouseenter', () => {
            starSpeed = 0.15;
            anime({
                targets: { val: marsMaterial.emissiveIntensity },
                val: 0.35, duration: 400,
                update: (anim) => { marsMaterial.emissiveIntensity = anim.animations[0].currentValue; },
                easing: 'easeOutQuad'
            });
            anime({ targets: atmosphereMaterial, opacity: 0.18, duration: 400 });
        });

        ctaBtn.addEventListener('mouseleave', () => {
            starSpeed = 0.006;
            anime({
                targets: { val: marsMaterial.emissiveIntensity },
                val: 0.15, duration: 700,
                update: (anim) => { marsMaterial.emissiveIntensity = anim.animations[0].currentValue; },
                easing: 'easeOutQuad'
            });
            anime({ targets: atmosphereMaterial, opacity: 0.08, duration: 700 });
        });

        ctaBtn.addEventListener('click', () => {
            const clickSound = document.getElementById('click-sfx');
            clickSound.currentTime = 0;
            clickSound.play();

            const overlay = document.getElementById('fade-overlay');
            if (overlay) {
                overlay.style.pointerEvents = 'auto';
                overlay.style.opacity = '1';
            }

            anime({ targets: camera.position, z: 6, duration: 600, easing: 'easeInQuad' });

            anime({
                targets: { light: mainLight.intensity, ambient: ambientLight.intensity, fill: fillLight.intensity, back: backLight.intensity },
                light: 0, ambient: 0, fill: 0, back: 0,
                duration: 700, easing: 'easeOutQuad',
                update: (anim) => {
                    const val = anim.animations[0].currentValue;
                    mainLight.intensity = val;
                    ambientLight.intensity = val * 0.8;
                    fillLight.intensity = val * 0.3;
                    backLight.intensity = val * 0.2;
                },
                complete: () => {
                    setTimeout(() => {
                        window.location.href = 'https://dididoingles.github.io/home/';
                    }, 200);
                }
            });

            anime({
                targets: { emiss: marsMaterial.emissiveIntensity },
                emiss: 0, duration: 700,
                update: (anim) => { marsMaterial.emissiveIntensity = anim.animations[0].currentValue; }
            });

            starSpeed = 0;
        });

        function animateStars() {
            const positions = stars.geometry.attributes.position.array;
            for (let i = 0; i < starCount; i++) {
                positions[i*3+2] += starSpeed;
                if (positions[i*3+2] > 50) positions[i*3+2] = -50;
            }
            stars.geometry.attributes.position.needsUpdate = true;

            const positions2 = stars2.geometry.attributes.position.array;
            for (let i = 0; i < starCount2; i++) {
                positions2[i*3+2] += starSpeed * 0.7;
                if (positions2[i*3+2] > 70) positions2[i*3+2] = -70;
            }
            stars2.geometry.attributes.position.needsUpdate = true;

            requestAnimationFrame(animateStars);
        }
        animateStars();

        let time = 0;

        function animate3D() {
            requestAnimationFrame(animate3D);
            time += 0.016;

            currentRotY += (targetRotY - currentRotY) * 0.08;
            currentRotX += (targetRotX - currentRotX) * 0.08;

            mars.rotation.y = currentRotY;
            mars.rotation.x = currentRotX * 0.4;
            atmosphere.rotation.y = mars.rotation.y;
            atmosphere.rotation.x = mars.rotation.x;

            dustParticles.rotation.y += 0.001;
            dustParticles.rotation.x += 0.0005;

            const pulse = 0.08 + Math.sin(time * 0.8) * 0.02;
            atmosphereMaterial.opacity = pulse;

            stars.rotation.y += 0.0002;
            stars.rotation.x += 0.0001;
            stars2.rotation.y -= 0.00015;

            renderer.render(scene, camera);
        }

        animate3D();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setTimeout(() => {
            targetRotY = 0.6;
            targetRotX = 0.1;
        }, 500);
    </script>

    <script type="module">
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();

            class TextScramble {
                constructor(el) {
                    this.el = el;
                    this.chars = '!<>-_\\/[]{}—=+*^?#_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
                    this.update = this.update.bind(this);
                }
                setText(newText) {
                    const oldText = this.el.innerText;
                    const length = Math.max(oldText.length, newText.length);
                    const promise = new Promise((resolve) => this.resolve = resolve);
                    this.queue = [];
                    for (let i = 0; i < length; i++) {
                        const from = oldText[i] || '';
                        const to = newText[i] || '';
                        const start = Math.floor(Math.random() * 40);
                        const end = start + Math.floor(Math.random() * 40);
                        this.queue.push({ from, to, start, end, char: '' });
                    }
                    cancelAnimationFrame(this.frameRequest);
                    this.frame = 0;
                    this.update();
                    return promise;
                }
                update() {
                    let output = '';
                    let complete = 0;
                    for (let i = 0, n = this.queue.length; i < n; i++) {
                        let { from, to, start, end, char } = this.queue[i];
                        if (this.frame >= end) {
                            complete++;
                            output += to;
                        } else if (this.frame >= start) {
                            if (!char || Math.random() < 0.28) {
                                char = this.randomChar();
                                this.queue[i].char = char;
                            }
                            output += `<span class="scramble-char">${char}</span>`;
                        } else {
                            output += from;
                        }
                    }
                    this.el.innerHTML = output;
                    if (complete === this.queue.length) {
                        this.resolve();
                    } else {
                        this.frameRequest = requestAnimationFrame(this.update);
                        this.frame++;
                    }
                }
                randomChar() { return this.chars[Math.floor(Math.random() * this.chars.length)]; }
            }

            const titleMainSpan = document.getElementById('scramble-title-main');
            const badgeSpan = document.getElementById('scramble-badge');
            const originalTitle = "Language Lab";
            const originalBadge = "Mars Linguistic Protocol Active";

            if (titleMainSpan) {
                const underline = titleMainSpan.querySelector('#title-line');
                titleMainSpan.innerHTML = '';
                titleMainSpan.appendChild(document.createTextNode(''));
                if (underline) titleMainSpan.appendChild(underline);
            }
            if (badgeSpan) badgeSpan.innerText = "";

            const titleScrambler = new TextScramble(titleMainSpan);
            const badgeScrambler = new TextScramble(badgeSpan);

            const tl = anime.timeline({ easing: 'easeOutExpo' });
            tl.add({ targets: '.hud-bracket', opacity: [0, 1], scale: [1.5, 1], duration: 1000, delay: anime.stagger(200) })
              .add({ targets: ['#ui-header', '#ui-footer'], opacity: [0, 1], translateY: [-20, 0], duration: 800 }, '-=600')
              .add({ targets: '#ui-badge', opacity: [0, 1], duration: 500, begin: () => badgeScrambler.setText(originalBadge) }, '-=400')
              .add({
                  duration: 1000,
                  begin: () => {
                      titleMainSpan.classList.add('reveal-title');
                      titleScrambler.setText(originalTitle).then(() => {
                          const underlineLine = document.getElementById('title-line');
                          if (underlineLine) {
                              anime({
                                  targets: underlineLine,
                                  scaleX: [0, 1],
                                  duration: 800,
                                  easing: 'easeOutQuint'
                              });
                          }
                      });
                  }
              }, '-=200')
              .add({ targets: '#ui-desc', opacity: [0, 1], translateY: [20, 0], duration: 800 }, '+=800')
              .add({ targets: '#cta-button', opacity: [0, 1], clipPath: ['polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%)', 'polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%)'], duration: 1000, easing: 'easeOutElastic(1, .8)' }, '-=400');

            const wordsList = ["SYNTAX", "PHONETICS", "SEMANTICS", "MORPHOLOGY", "PRAGMATICS", "LEXICON", "FLUENCY", "IDIOM", "VERB", "COGNATE", "MARS", "OLYMPUS", "ARES"];
            const bgContainer = document.getElementById('bg-words-container');

            for(let i = 0; i < 18; i++) {
                const wordEl = document.createElement('div');
                wordEl.classList.add('bg-word');
                wordEl.innerText = wordsList[Math.floor(Math.random() * wordsList.length)];
                wordEl.style.left = `${Math.random() * 100}%`;
                wordEl.style.top = `${Math.random() * 100}%`;
                const randomScale = Math.random() * 1.5 + 0.5;
                wordEl.style.transform = `scale(${randomScale})`;
                wordEl.style.opacity = '0';
                bgContainer.appendChild(wordEl);

                anime({
                    targets: wordEl,
                    translateX: () => anime.random(-120, 120),
                    translateY: () => anime.random(-120, 120),
                    opacity: [0, Math.random() * 0.12],
                    duration: () => anime.random(12000, 22000),
                    direction: 'alternate',
                    loop: true,
                    easing: 'linear'
                });
            }
        });
    </script>
