<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/png" href="favicon.png">
    <title>Language Lab</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-primary: #c8000a;
            --color-primary-dark: #990000;
            --color-primary-hover: #b30000;
            --color-bg-app: #ffffff;
            --color-bg-body: #f8fafc;
            --color-card-bg: #ffffff;
            --color-border: #f1f5f9;
            --color-border-drawer: rgba(226, 232, 240, 0.8);
            --color-text-main: #333333;
            --color-text-muted: #555555;
            --color-text-subtle: #94a3b8;
            --color-icon: #374151;
            --color-grid-line: rgba(200, 200, 210, 0.28);
            --color-white-translucent-20: rgba(255, 255, 255, 0.2);
            --color-white-translucent-10: rgba(255, 255, 255, 0.1);
            --color-white-translucent-70: rgba(255, 255, 255, 0.7);

            --shadow-app: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --shadow-drawer: 0 10px 25px -5px rgba(0, 0, 0, 0.151), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.157);
            --shadow-panel: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);

            --navbar-height: 64px;
            --sidebar-closed-width: 96px;
            --sidebar-open-width: 260px;

            /* GRID DE ÍCONES (posicionamento desktop — igual index5.html) */
            --icon-grid-left: 210px;
            --icon-grid-width: 240px;
            --icon-grid-gap-x: 45px;
            --icon-grid-gap-y: 12px;
            --card-size: 72px;

            --transition-speed: 0.35s;
            --transition-curve: cubic-bezier(0.4, 0, 0.2, 1);

            --gooey-primary: #c8000a;
            --gooey-primary-light: #e01a2a;
            --gooey-pill-size: 46px;

            /* Skeleton */
            --skeleton-base: #eef1f5;
            --skeleton-shine: #f7f9fc;

            /* Decoração build.png (grande, canto inferior direito) */
            --decor-build-width: calc(620px * 1);  /* = 496px */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.5px;
            background-color: var(--color-bg-body);
            color: var(--color-text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 1366px;
            height: 100vh;
            max-height: 100vh;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: var(--color-bg-app);
            box-shadow: var(--shadow-app);
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, var(--color-grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--color-grid-line) 1px, transparent 1px);
            background-position: 0 0;
        }

        /* ---------- NAVBAR ---------- */
        .navbar {
            height: var(--navbar-height);
            background-color: var(--color-primary);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            user-select: none;
            position: relative;
            z-index: 70;
            box-sizing: border-box;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 0;
            min-width: 0;
            flex: 1;
        }

        .navbar-brand {
            display: flex; align-items: center; gap: 12px;
            color: #fff; text-decoration: none; cursor: pointer;
        }

        /* Container do logo — sem pill, sem background, sem borda */
        .navbar-logo-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Imagem do logo (faviconbranco.png) */
        .navbar-logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .navbar-title { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; }

        .navbar-greeting-separator {
            color: var(--color-white-translucent-70);
            font-weight: 400; font-size: 0.95rem; margin: 0 2px;
            user-select: none;
        }

        .navbar-greeting {
            color: var(--color-white-translucent-70);
            font-weight: 400; font-size: 0.95rem;
            letter-spacing: -0.5px; user-select: none;
        }

        .navbar-actions { display: flex; align-items: center; gap: 16px; color: #fff; flex-shrink: 0; }

        .navbar-btn {
            background: transparent; border: none; cursor: pointer;
            padding: 8px; border-radius: 50%;
            transition: background-color 0.2s, opacity 0.2s;
            color: #fff; font-size: 1.125rem;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        .navbar-btn:hover { background-color: var(--color-white-translucent-10); }

        #sound-icon {
            display: inline-block;
            transition: color 0.2s ease;
            transform-origin: center;
        }

        .navbar-btn.muted #sound-icon {
            color: rgba(255, 255, 255, 0.55);
        }

        @keyframes soundTogglePop {
            0%   { transform: scale(1) rotate(0deg); }
            40%  { transform: scale(0.7) rotate(-15deg); }
            70%  { transform: scale(1.15) rotate(8deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .navbar-btn.toggling #sound-icon {
            animation: soundTogglePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ---------- BOTAO MENU MOBILE (oculto no desktop) ---------- */
        .mobile-menu-btn {
            display: none;
            align-items: center; justify-content: center;
            width: 36px; height: 36px; padding: 0;
            background-color: transparent;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .mobile-menu-btn:hover { background-color: var(--color-white-translucent-10); }

        .mobile-menu-btn .lucide {
            width: 1.35rem;
            height: 1.35rem;
            stroke-width: 2.2;
        }

        /* ---------- OVERLAY DESKTOP DA SIDEBAR ---------- */
        .sidebar-overlay {
            position: absolute;
            top: var(--navbar-height);
            left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
        }

        /* ---------- SIDEBAR (DESKTOP) ---------- */
        .sidebar-drawer {
            position: absolute;
            top: calc(50% + (var(--navbar-height) / 2));
            transform: translateY(-50%);
            left: 20px;
            height: calc(100% - 100px);
            max-height: 620px;
            background: var(--color-bg-app);
            border-radius: 20px;
            box-shadow: var(--shadow-drawer);
            z-index: 60;
            transition: width var(--transition-speed) var(--transition-curve);
            overflow: hidden;
            border: 1px solid var(--color-border-drawer);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            user-select: none;
            box-sizing: border-box;
            width: var(--sidebar-closed-width);
        }

        .sidebar-drawer:hover,
        .sidebar-drawer.open { width: var(--sidebar-open-width); }

        .sidebar-drawer:hover .nav-text,
        .sidebar-drawer.open .nav-text { opacity: 1; }

        /* ---------- NAV ITEMS ---------- */
        .nav-group {
            display: flex; flex-direction: column; gap: 12px;
            position: relative; padding: 0 20px;
            width: 100%;
        }

        .nav-item {
            display: flex; align-items: center; height: 48px;
            padding: 0; color: var(--color-text-muted);
            border-radius: 12px;
            transition: color 0.25s ease;
            cursor: pointer; white-space: nowrap;
            position: relative; z-index: 2;
            background: transparent; text-decoration: none;
        }

        .nav-item.active { color: var(--color-primary); }
        .nav-item.pill-hover .nav-icon-box { color: #fff; }
        .nav-item.pill-hover .nav-icon-box i { color: #fff; }

        .nav-icon-box {
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; flex-shrink: 0;
            z-index: 3; position: relative;
            transition: color 0.2s ease;
        }

        .nav-text {
            font-size: 0.95rem; font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s ease, color 0.2s ease;
            z-index: 3; position: relative;
            margin-left: 14px; color: inherit; cursor: pointer;
        }

        .nav-item.pill-hover .nav-text { color: var(--color-primary); }
        .nav-text:hover { color: var(--color-primary); }

        /* ---------- GOOEY PILL ---------- */
        .gooey-pill {
            position: absolute;
            width: var(--gooey-pill-size);
            height: var(--gooey-pill-size);
            background: linear-gradient(135deg, var(--gooey-primary), var(--gooey-primary-light));
            border-radius: 14px;
            z-index: 1; opacity: 0;
            transition: top 0.28s cubic-bezier(0.34, 1.2, 0.64, 1),
                        left 0.28s cubic-bezier(0.34, 1.2, 0.64, 1),
                        opacity 0.2s ease;
            pointer-events: none;
            box-shadow: 0 6px 14px rgba(200, 0, 10, 0.3);
            will-change: transform, top, left;
            transform-origin: center;
        }

        .gooey-pill.active { opacity: 1; }

        @keyframes gooeyStretch {
            0%   { transform: scale(1, 1);      border-radius: 14px; }
            35%  { transform: scale(0.7, 1.35); border-radius: 18px 12px 18px 12px; }
            70%  { transform: scale(1.05, 0.92); border-radius: 12px 18px 12px 18px; }
            100% { transform: scale(1, 1);      border-radius: 14px; }
        }

        .pill-animate {
            animation: gooeyStretch 0.3s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }

        /* ============================================================
           ÁREA DE CONTEÚDO
           ============================================================ */
        .view-container {
            position: absolute;
            top: var(--navbar-height);
            left: 0; right: 0; bottom: 0;
            z-index: 10;
            overflow: hidden;
        }

        .view-container > * {
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- PÁGINAS INTERNAS ---------- */
        .page-content {
            padding: 40px 40px 40px 240px;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .page-title {
            font-size: 1.75rem;
            color: var(--color-primary);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .page-sub {
            color: var(--color-text-subtle);
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        /* ---------- BOTÃO VOLTAR (DISCRETO EM CINZA) ---------- */
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            margin-bottom: 24px;
            color: var(--color-text-subtle);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--color-text-muted);
            text-decoration: underline;
        }

        .back-link .lucide {
            width: 1rem;
            height: 1rem;
            stroke-width: 2;
        }

        /* ---------- CARDS GRID (usado em páginas tipo menu) ---------- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            max-width: 760px;
        }

        .card-item {
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: var(--shadow-card);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .card-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(200, 0, 10, 0.18);
        }

        .card-item-icon {
            width: 40px; height: 40px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(200, 0, 10, 0.08);
            border-radius: 10px;
            color: var(--color-primary);
        }

        .card-item-icon .lucide { width: 20px; height: 20px; }

        .card-item-body { flex: 1; }

        .card-item h3 {
            font-size: 1rem;
            margin-bottom: 4px;
            color: var(--color-text-main);
        }

        .card-item p {
            font-size: 0.8rem;
            color: var(--color-text-subtle);
        }

        /* ---------- TOOLS LIST (lista de ferramentas dentro de um lab) ---------- */
        .tools-list {
            list-style: none;
            max-width: 520px;
        }

        .tools-list li {
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            font-size: 0.95rem;
            color: var(--color-text-main);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tools-list li:hover {
            transform: translateX(4px);
            border-color: var(--color-primary);
        }

        .tool-icon {
            width: 32px; height: 32px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(200, 0, 10, 0.08);
            border-radius: 8px;
            color: var(--color-primary);
        }

        .tool-icon .lucide { width: 16px; height: 16px; }

        /* ============================================================
           PÁGINA DE FERRAMENTA EXTERNA
           ============================================================ */
        .tool-page {
            max-width: 640px;
        }

        .tool-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: 18px;
            padding: 24px;
            box-shadow: var(--shadow-card);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            border-color: var(--color-primary);
            box-shadow: 0 16px 32px rgba(200, 0, 10, 0.18);
        }

        .tool-card-icon {
            width: 72px; height: 72px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(200, 0, 10, 0.08);
            border-radius: 18px;
            color: var(--color-primary);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .tool-card:hover .tool-card-icon {
            background: var(--color-primary);
            color: #fff;
        }

        .tool-card-icon .lucide { width: 34px; height: 34px; stroke-width: 2; }

        .tool-card-body { flex: 1; min-width: 0; }

        .tool-card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--color-text-main);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .tool-card-desc {
            font-size: 0.85rem;
            color: var(--color-text-subtle);
            line-height: 1.45;
            margin: 0;
        }

        .tool-card-external {
            position: absolute;
            top: 14px;
            right: 14px;
            color: var(--color-text-subtle);
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .tool-card-external .lucide {
            width: 18px;
            height: 18px;
            stroke-width: 2;
        }

        .tool-card:hover .tool-card-external {
            color: var(--color-primary);
            transform: translate(2px, -2px);
        }

        /* ============================================================
           PÁGINA INICIAL — GRID DE ÍCONES + PAINEL AVISOS
           ============================================================ */
        .home-page {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        .home-inner {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding-left: var(--icon-grid-left);
            box-sizing: border-box;
            gap: 28px;
        }

        .home-heading {
            width: var(--icon-grid-width);
            text-align: center;
            z-index: 11;
            pointer-events: none;
            flex-shrink: 0;
        }

        .home-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            white-space: nowrap;
            line-height: 1.15;
        }

        .home-sub {
            font-size: 0.875rem;
            font-weight: 400;
            color: var(--color-text-subtle);
            margin: 0;
            white-space: nowrap;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        /* ---------- GRID DE ÍCONES ---------- */
        .icons-grid-container {
            width: var(--icon-grid-width);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: none;
            flex-shrink: 0;
        }

        .icons-grid-container > * { pointer-events: auto; }

        .icons-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: var(--icon-grid-gap-x);
            row-gap: var(--icon-grid-gap-y);
            justify-items: center;
            width: 100%;
        }

        .grid-icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .grid-icon-card {
            width: var(--card-size);
            height: var(--card-size);
            background: var(--color-card-bg);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--color-border);
            transition: transform 0.25s cubic-bezier(0.34, 1.3, 0.64, 1),
                        background-color 0.25s ease,
                        box-shadow 0.25s ease,
                        border-color 0.25s ease;
            cursor: pointer;
            box-sizing: border-box;
        }

        .grid-icon-card:hover {
            transform: scale(1.05);
            background: var(--color-primary);
            border-color: var(--color-primary);
            box-shadow: 0 8px 18px rgba(200, 0, 10, 0.28);
        }

        .grid-card-icon {
            color: var(--color-icon);
            font-size: 1.25rem;
            transition: color 0.25s ease;
        }

        .grid-icon-card:hover .grid-card-icon { color: #fff; }

        .grid-card-label {
            font-family: 'Shadows Into Light', cursive;
            font-size: 1rem;
            color: var(--color-icon);
            margin-top: 4px;
            font-weight: 400;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -0.3px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: color 0.25s ease;
        }

        .grid-icon-wrapper:hover .grid-card-label { color: var(--color-primary); }

        /* ---------- PAINEL AVISOS ---------- */
        .avisos-panel {
            position: absolute;
            top: 24px;
            right: 38px;
            width: 330px;
            height: 180px;
            background-color: var(--color-bg-app);
            border-radius: 1rem;
            box-shadow: var(--shadow-panel);
            overflow: hidden;
            border: 1px solid var(--color-border);
            z-index: 20;
            display: flex; flex-direction: column;
            box-sizing: border-box;
        }

        .avisos-header {
            background-color: var(--color-primary);
            height: 40px; padding: 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            color: #fff; user-select: none; box-sizing: border-box;
            flex-shrink: 0;
        }

        .avisos-header-title-box { display: flex; align-items: center; gap: 8px; }

        .avisos-header-badge {
            width: 20px; height: 20px; border-radius: 50%;
            background-color: var(--color-white-translucent-20);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem;
        }

        .avisos-header-title { font-weight: 700; font-size: 0.875rem; }

        .avisos-header-dots { display: flex; align-items: center; gap: 6px; }

        .avisos-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: #fff; opacity: 0.9; display: inline-block;
        }

        .avisos-body {
            padding: 16px; flex: 1;
            position: relative; background-color: #fff;
            box-sizing: border-box;
            overflow: hidden;
        }

        .avisos-text {
            font-size: 0.75rem; color: var(--color-text-subtle);
            font-style: italic; margin: 0;
            position: relative;
            z-index: 2;
            max-width: 60%;
        }

        .avisos-mars {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 92px;
            height: auto;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            z-index: 1;
        }

        /* ---------- OVERLAY MOBILE ---------- */
        .mobile-overlay {
            display: none;
            position: fixed; inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 55;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mobile-overlay.active { display: block; opacity: 1; }

        /* ============================================================
           SKELETON LOADER
           ============================================================ */
        .skeleton-page {
            padding: 40px 40px 40px 240px;
            height: 100%;
            box-sizing: border-box;
        }

        .skeleton-line,
        .skeleton-block {

            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                var(--skeleton-shine) 50%,
                transparent 100%
            );
            transform: translateX(-100%);
            animation: skeletonShimmer 1.4s infinite;
        }

        @keyframes skeletonShimmer {
            100% { transform: translateX(100%); }
        }

        .skeleton-back    { width: 140px; height: 14px; margin-bottom: 24px; }
        .skeleton-title   { width: 260px; height: 28px; margin-bottom: 10px; }
        .skeleton-sub     { width: 340px; height: 14px; margin-bottom: 32px; }
        .skeleton-card    { height: 92px; border-radius: 14px; }

        .skeleton-icon    { height: var(--card-size); border-radius: 18px; }

        .skeleton-cards {

            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            max-width: 760px;
        }

        .skeleton-tools {
            max-width: 520px;
        }

        .skeleton-tool-page {
            max-width: 640px;
        }

        /* Skeleton da home */
        .skeleton-page.skeleton-page-home {
            padding: 0;
            position: relative;
        }

        .skeleton-home {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding-left: var(--icon-grid-left);
            box-sizing: border-box;
            gap: 28px;
        }

        .skeleton-home-grid {
            width: var(--icon-grid-width);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: var(--icon-grid-gap-x);
            row-gap: var(--icon-grid-gap-y);
            justify-items: center;
        }

        .skeleton-home-panel {
            position: absolute;
            top: 24px;
            right: 38px;
            width: 330px;
            height: 180px;
            border-radius: 1rem;
        }

        /* ============================================================
           STAGGER / MOUNT ANIMATION
           ============================================================ */
        .stagger-item {
            opacity: 0;
            transform: translateY(14px);
            animation: staggerIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes staggerIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .stagger-item,
            .view-container > *,
            .skeleton-line::after,
            .skeleton-block::after,
            .decor {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }

        /* ============================================================
           DECORAÇÃO build.png
           ============================================================ */
        .decorations {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }

        .decor {
            position: absolute;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            opacity: 0;
            animation: decorFadeIn 1.2s ease forwards;
        }

        @keyframes decorFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .decor-build {
            right: 0;
            bottom: 0;
            width: var(--decor-build-width);
            height: auto;
            animation-delay: 0.4s;
        }

        @media screen and (max-width: 1024px) {
            :root {
                --decor-build-width: 460px;
            }
        }

        /* ============================================================

            }

            .page-content { padding: 20px 24px 40px 24px; }
            .skeleton-page { padding: 20px 24px 40px 24px; }

<template id="pagina-minhas-aulas">
    <section class="page-content">
        <a class="back-link" href="#inicio">
            <i data-lucide="arrow-left"></i> Voltar para o início
        </a>
        <h2 class="page-title">Minhas Aulas</h2>
        <p class="page-sub">Veja os assuntos das aulas aplicadas.</p>
        <ul class="tools-list">
            <li><div class="tool-icon"><i data-lucide="calendar"></i></div>Aula 1 — Present Simple</li>
            <li><div class="tool-icon"><i data-lucide="calendar"></i></div>Aula 2 — Past Simple</li>
            <li><div class="tool-icon"><i data-lucide="calendar"></i></div>Aula 3 — Present Perfect</li>
        </ul>
    </section>
</template>


<script>
    lucide.createIcons();

    (function() {
        // ---------- SFX SYSTEM ----------
        let sfxEnabled = true;
        let sfxReady = false;
        const audioCache = {};

        const audioUrls = {
            hover: 'https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780071228/soundshelfstudio-ui-tap-soft-short-514599_utntsl.mp3',
            click: 'https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780071236/zapsplat_multimedia_beep_soft_click_button_87548_a99mcv.mp3'
        };

        function preloadAudio() {
            let loaded = 0;
            const total = Object.keys(audioUrls).length;
            for (const [key, url] of Object.entries(audioUrls)) {
                const audio = new Audio(url);
                audio.volume = 0.4;
                audio.addEventListener('canplaythrough', () => {
                    loaded++;
                    if (loaded === total) sfxReady = true;
                });
                audio.addEventListener('error', () => {
                    console.warn(`Erro ao carregar áudio: ${key}`);
                    loaded++;
                    if (loaded === total) sfxReady = true;
                });
                audioCache[key] = audio;
            }
        }

        function playSFX(type, volume = 0.3) {
            if (!sfxEnabled || !sfxReady || !audioCache[type]) return;
            const a = audioCache[type];
            a.currentTime = 0;
            a.volume = volume;
            a.play().catch(e => {});
        }

        preloadAudio();

        // ---------- TOGGLE DE SOM ----------
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const soundIcon = document.getElementById('sound-icon');

        if (soundToggleBtn && soundIcon) {
            soundToggleBtn.addEventListener('click', () => {
                sfxEnabled = !sfxEnabled;

                soundIcon.classList.toggle('fa-volume-high', sfxEnabled);
                soundIcon.classList.toggle('fa-volume-xmark', !sfxEnabled);

                soundToggleBtn.classList.toggle('muted', !sfxEnabled);

                soundToggleBtn.classList.remove('toggling');
                void soundToggleBtn.offsetWidth;
                soundToggleBtn.classList.add('toggling');
                setTimeout(() => soundToggleBtn.classList.remove('toggling'), 400);

                playSFX('click', 0.3);
            });
        }

        // ---------- SFX NO LOGO (navbar-brand) ----------
        const navbarBrand = document.querySelector('.navbar-brand');
        if (navbarBrand) {
            navbarBrand.addEventListener('mouseenter', () => {
                if (isMobile()) return;
                playSFX('hover', 0.15);
            });
            navbarBrand.addEventListener('click', () => {
                playSFX('click', 0.3);
            });
        }

        // ---------- ELEMENTOS ----------
        const sidebarDrawer = document.getElementById('sidebarDrawer');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const mobileMenuBtn = document.getElementById('mobile-menu-toggle');
        const mobileOverlay = document.getElementById('mobileOverlay');

        const pill = document.createElement('div');
        pill.className = 'gooey-pill';
        sidebarDrawer.appendChild(pill);

        const navItems = document.querySelectorAll('.nav-item');
        let activeIndex = -1;
        let animationTimeout = null;

        function clearPillHover() {
            navItems.forEach(item => item.classList.remove('pill-hover'));
        }

        function updatePillPosition(index, triggerAnimation = true) {
            if (isMobile()) return;
            if (index < 0 || index >= navItems.length) return;
            const targetItem = navItems[index];
            const iconBox = targetItem.querySelector('.nav-icon-box');
            if (!iconBox) return;

            const itemRect = targetItem.getBoundingClientRect();
            const iconRect = iconBox.getBoundingClientRect();
            const drawerRect = sidebarDrawer.getBoundingClientRect();

            const pillSize = 46;
            const relativeTop = itemRect.top - drawerRect.top;
            const pillTop = relativeTop + (itemRect.height - pillSize) / 2;
            const iconCenterX = iconRect.left - drawerRect.left + (iconRect.width / 2);
            const pillLeft = iconCenterX - (pillSize / 2);

            pill.style.top = pillTop + 'px';
            pill.style.left = pillLeft + 'px';

            if (!pill.classList.contains('active')) pill.classList.add('active');

            clearPillHover();
            targetItem.classList.add('pill-hover');

            if (triggerAnimation) {
                pill.classList.remove('pill-animate');
                void pill.offsetWidth;
                pill.classList.add('pill-animate');

                if (animationTimeout) clearTimeout(animationTimeout);
                animationTimeout = setTimeout(() => {
                    pill.classList.remove('pill-animate');
                }, 320);
            }
        }

        function hidePill() {
            pill.classList.remove('active');
            clearPillHover();
            activeIndex = -1;
        }

        function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        navItems.forEach((item, idx) => {
            item.addEventListener('mouseenter', () => {
                if (isMobile()) return;
                activeIndex = idx;
                updatePillPosition(idx, true);
                playSFX('hover', 0.2);
            });
        });

        function showSidebarOverlay() {
            if (isMobile()) return;
            sidebarOverlay.classList.add('active');
        }
        function hideSidebarOverlay() {
            if (isMobile()) return;
            sidebarOverlay.classList.remove('active');
        }

        sidebarDrawer.addEventListener('mouseenter', () => {
            if (isMobile()) return;
            showSidebarOverlay();
        });

        sidebarDrawer.addEventListener('mouseleave', () => {
            if (isMobile()) return;
            hidePill();
            hideSidebarOverlay();
        });

        sidebarOverlay.addEventListener('click', () => {
            hidePill();
            hideSidebarOverlay();
        });

        sidebarDrawer.addEventListener('transitionend', (e) => {
            if (isMobile()) return;
            if (e.propertyName === 'width' && activeIndex !== -1 && pill.classList.contains('active')) {
                updatePillPosition(activeIndex, false);
            }
        });

        let resizeTimeout;
        window.addEventListener('resize', () => {
            if (isMobile()) {
                hidePill();
                return;
            }
            if (activeIndex !== -1 && pill.classList.contains('active')) {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    updatePillPosition(activeIndex, false);
                }, 100);
            }
        });

        function openMobileSidebar() {
            sidebarDrawer.classList.add('mobile-open');
            mobileOverlay.classList.add('active');
            playSFX('click');
        }

        function closeMobileSidebar() {
            sidebarDrawer.classList.remove('mobile-open');
            mobileOverlay.classList.remove('active');
        }

        mobileMenuBtn.addEventListener('click', openMobileSidebar);
        mobileOverlay.addEventListener('click', closeMobileSidebar);

        // ============================================================
        // ROTEADOR DA CASCA + LAZY LOAD
        // ============================================================
        const rotas = [
            'inicio', 'laboratorios',
            'fala', 'escuta', 'pronuncia', 'leitura', 'escrita',
            'biblioteca', 'quadro', 'minhas-aulas',
            'praticar-fala', 'ouvir-texto', 'ajudante',
            'roleplay', 'stories', 'quiz'
        ];

        const rotasComCards = ['laboratorios'];
        const rotasHome = ['inicio'];
        const rotasToolPage = ['praticar-fala', 'ouvir-texto', 'ajudante', 'roleplay', 'stories', 'quiz'];

        const LOAD_DELAY = 600;
        const SKELETON_MIN_TIME = 500;

        let loadToken = 0;

        function rotaAtual() {
            const h = location.hash.replace('#', '');
            return rotas.includes(h) ? h : 'inicio';
        }

        function marcarLinkAtivo(rota) {
            document.querySelectorAll('.nav-item').forEach(a => {
                a.classList.toggle('active', a.dataset.rota === rota);
            });
        }

        // ---------- GERADOR DE SKELETON ----------
        function gerarSkeleton(rota) {
            const usaHome = rotasHome.includes(rota);
            const usaCards = rotasComCards.includes(rota);
            const usaToolPage = rotasToolPage.includes(rota);
            const wrapper = document.createElement('section');
            wrapper.className = 'skeleton-page';

            if (usaHome) {
                wrapper.classList.add('skeleton-page-home');

                const home = document.createElement('div');
                home.className = 'skeleton-home';

                const heading = document.createElement('div');
                heading.style.width = 'var(--icon-grid-width)';
                heading.style.display = 'flex';
                heading.style.flexDirection = 'column';
                heading.style.alignItems = 'center';
                heading.style.gap = '8px';

                const titleSkel = document.createElement('div');
                titleSkel.className = 'skeleton-line';
                titleSkel.style.width = '180px';
                titleSkel.style.height = '24px';
                heading.appendChild(titleSkel);

                const subSkel = document.createElement('div');
                subSkel.className = 'skeleton-line';
                subSkel.style.width = '220px';
                subSkel.style.height = '12px';
                heading.appendChild(subSkel);

                home.appendChild(heading);

                const grid = document.createElement('div');
                grid.className = 'skeleton-home-grid';
                for (let i = 0; i < 8; i++) {
                    const c = document.createElement('div');
                    c.className = 'skeleton-block skeleton-icon';
                    grid.appendChild(c);
                }
                home.appendChild(grid);

                const panel = document.createElement('div');
                panel.className = 'skeleton-block skeleton-home-panel';
                home.appendChild(panel);

                wrapper.appendChild(home);
                return wrapper;
            }

            const back = document.createElement('div');
            back.className = 'skeleton-line skeleton-back';
            wrapper.appendChild(back);

            const title = document.createElement('div');
            title.className = 'skeleton-line skeleton-title';
            wrapper.appendChild(title);

            const sub = document.createElement('div');
            sub.className = 'skeleton-line skeleton-sub';
            wrapper.appendChild(sub);

            if (usaCards) {
                const grid = document.createElement('div');
                grid.className = 'skeleton-cards';
                for (let i = 0; i < 4; i++) {
                    const c = document.createElement('div');
                    c.className = 'skeleton-block skeleton-card';
                    grid.appendChild(c);
                }
                wrapper.appendChild(grid);
            } else if (usaToolPage) {
                const box = document.createElement('div');
                box.className = 'skeleton-tool-page';
                const card = document.createElement('div');
                card.className = 'skeleton-block skeleton-tool-card';
                box.appendChild(card);
                wrapper.appendChild(box);
            } else {
                const list = document.createElement('div');
                list.className = 'skeleton-tools';
                for (let i = 0; i < 3; i++) {
                    const t = document.createElement('div');
                    t.className = 'skeleton-block skeleton-tool';
                    list.appendChild(t);
                }
                wrapper.appendChild(list);
            }

            return wrapper;
        }

        // ---------- APLICA STAGGER NOS ITENS REAIS ----------
        function aplicarStagger(raiz) {
            const alvos = raiz.querySelectorAll(
                '.back-link, .page-title, .page-sub, .card-item, .tools-list li, .grid-icon-wrapper, .avisos-panel, .home-heading, .tool-card'
            );

            alvos.forEach((el, i) => {
                el.classList.add('stagger-item');
                el.style.animationDelay = (40 + i * 55) + 'ms';
            });
        }

        // ---------- BIND DE INTERAÇÕES NA HOME ----------
        function bindHomeInteractions(pageRoot) {
            pageRoot.querySelectorAll('.grid-icon-card').forEach(card => {
                card.addEventListener('mouseenter', () => {
                    if (isMobile()) return;
                    playSFX('hover', 0.2);
                });
                card.addEventListener('click', () => {
                    playSFX('click', 0.35);
                    const href = card.getAttribute('data-href');
                    if (href && href !== '#') {
                        if (href.startsWith('#')) {
                            location.hash = href;
                        } else {
                            window.location.href = href;
                        }
                    }
                });
            });
        }

        // ---------- RENDER PRINCIPAL ----------
        function carregarPagina(rota) {
            const tpl = document.getElementById('pagina-' + rota);
            if (!tpl) return;

            const view = document.getElementById('view');
            const token = ++loadToken;

            view.innerHTML = '';
            view.appendChild(gerarSkeleton(rota));

            marcarLinkAtivo(rota);
            if (isMobile()) closeMobileSidebar();

            setTimeout(() => {
                if (token !== loadToken) return;

                view.innerHTML = '';
                const section = tpl.content.cloneNode(true);
                view.appendChild(section);

                if (window.lucide) lucide.createIcons();

                const pageRoot = view.querySelector('.page-content, .home-page') || view;
                aplicarStagger(pageRoot);

                view.querySelectorAll('.card-item, .tools-list li, .back-link, .tool-card').forEach(el => {
                    el.addEventListener('mouseenter', () => {
                        if (isMobile()) return;
                        playSFX('hover', 0.15);
                    });
                    el.addEventListener('click', () => playSFX('click', 0.3));
                });

                bindHomeInteractions(pageRoot);
            }, Math.max(LOAD_DELAY, SKELETON_MIN_TIME));
        }

        window.addEventListener('hashchange', () => {
            carregarPagina(rotaAtual());
        });

        carregarPagina(rotaAtual());

    })();
</script>
</body>
