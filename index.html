<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Lab</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-primary: #c8000a;
            --color-primary-dark: #990000;
            --color-primary-hover: #b30000;
            --color-bg-app: #ffffff;
            --color-bg-body: #f8fafc;
            --color-card-bg: #ffffff;
            --color-border: #f1f5f9;
            --color-border-drawer: rgba(226, 232, 240, 0.8);
            --color-text-main: #333333;
            --color-text-muted: #555555;
            --color-text-subtle: #94a3b8;
            --color-icon: #374151;
            --color-grid-line: rgba(200, 200, 210, 0.28);
            --color-white-translucent-20: rgba(255, 255, 255, 0.2);
            --color-white-translucent-10: rgba(255, 255, 255, 0.1);
            --color-white-translucent-70: rgba(255, 255, 255, 0.7);

            --shadow-app: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --shadow-drawer: 0 10px 25px -5px rgba(0, 0, 0, 0.151), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.157);
            --shadow-card-hover: 0 12px 24px rgba(200, 0, 10, 0.35);
            --shadow-panel: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);

            --navbar-height: 64px;

            --sidebar-closed-width: 96px;
            --sidebar-open-width: 260px;

            /* GRID RECUADO: começa a 210px, sidebar aberta cobre parcialmente */
            --icon-grid-left: 210px;
            --icon-grid-width: 240px;
            --icon-grid-gap-x: 45px;
            --icon-grid-gap-y: 12px;
            --card-size: 72px;

            --transition-speed: 0.35s;
            --transition-curve: cubic-bezier(0.4, 0, 0.2, 1);

            --gooey-primary: #c8000a;
            --gooey-primary-light: #e01a2a;
            --gooey-pill-size: 46px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            letter-spacing: -0.5px;
            background-color: var(--color-bg-body);
            color: var(--color-text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 1366px;
            height: 100vh;
            max-height: 100vh;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: var(--color-bg-app);
            box-shadow: var(--shadow-app);
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, var(--color-grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--color-grid-line) 1px, transparent 1px);
            background-position: 0 0;
        }

        .navbar {
            height: var(--navbar-height);
            background-color: var(--color-primary);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            user-select: none;
            position: relative;
            z-index: 70;
            box-sizing: border-box;
        }

        .navbar-brand { display: flex; align-items: center; gap: 12px; color: #fff; }

        .navbar-logo-badge {
            width: 32px; height: 32px; border-radius: 50%;
            background-color: var(--color-white-translucent-20);
            display: flex; align-items: center; justify-content: center;
        }

        .navbar-brain-icon { color: #fff; font-size: 1.125rem; }

        .navbar-title { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; }

        .navbar-greeting-separator {
            color: var(--color-white-translucent-70);
            font-weight: 400; font-size: 0.95rem; margin: 0 2px;
            user-select: none;
        }

        .navbar-greeting {
            color: var(--color-white-translucent-70);
            font-weight: 400; font-size: 0.95rem;
            letter-spacing: -0.5px; user-select: none;
        }

        .navbar-actions { display: flex; align-items: center; gap: 16px; color: #fff; }

        .navbar-btn {
            background: transparent; border: none; cursor: pointer;
            padding: 8px; border-radius: 50%;
            transition: background-color 0.2s;
            color: #fff; font-size: 1.125rem;
            display: flex; align-items: center; justify-content: center;
        }

        .navbar-btn:hover { background-color: var(--color-white-translucent-10); }

        /* ---------- BOTAO MENU MOBILE ---------- */
        .mobile-menu-wrapper { display: none; }

        .mobile-menu-btn {
            display: flex; align-items: center; gap: 8px;
            height: 40px; padding: 0 14px;
            background-color: transparent;
            color: var(--color-primary);
            border: 1.5px solid var(--color-primary);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.875rem; font-weight: 600;
            letter-spacing: -0.5px; cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .mobile-menu-btn i { font-size: 1rem; }
        .mobile-menu-btn:hover { background-color: rgba(200, 0, 10, 0.08); }

        /* ---------- OVERLAY DESKTOP DA SIDEBAR ---------- */
        .sidebar-overlay {
            position: absolute;
            top: var(--navbar-height);
            left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
        }

        /* ---------- SIDEBAR ---------- */
        .sidebar-drawer {
            position: absolute;
            top: calc(50% + (var(--navbar-height) / 2));
            transform: translateY(-50%);
            left: 20px;
            height: calc(100% - 100px);
            max-height: 620px;
            background: var(--color-bg-app);
            border-radius: 20px;
            box-shadow: var(--shadow-drawer);
            z-index: 60;
            transition: width var(--transition-speed) var(--transition-curve);
            overflow: hidden;
            border: 1px solid var(--color-border-drawer);
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
            box-sizing: border-box;
            width: var(--sidebar-closed-width);
        }

        .sidebar-drawer:hover,
        .sidebar-drawer.open { width: var(--sidebar-open-width); }

        .sidebar-drawer:hover .nav-text,
        .sidebar-drawer.open .nav-text { opacity: 1; }

        /* ---------- NAV ITEMS ---------- */
        .nav-group {
            display: flex; flex-direction: column; gap: 12px;
            position: relative; padding: 0 20px;
        }

        .nav-item {
            display: flex; align-items: center; height: 48px;
            padding: 0; color: var(--color-text-muted);
            border-radius: 12px;
            transition: color 0.25s ease;
            cursor: pointer; white-space: nowrap;
            position: relative; z-index: 2;
            background: transparent; text-decoration: none;
        }

        .nav-item.active { color: var(--color-primary); }
        .nav-item.pill-hover .nav-icon-box { color: #fff; }
        .nav-item.pill-hover .nav-icon-box i { color: #fff; }

        .nav-icon-box {
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; flex-shrink: 0;
            z-index: 3; position: relative;
            transition: color 0.2s ease;
        }

        .nav-text {
            font-size: 0.95rem; font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s ease, color 0.2s ease;
            z-index: 3; position: relative;
            margin-left: 14px; color: inherit; cursor: pointer;
        }

        .nav-item.pill-hover .nav-text { color: var(--color-primary); }
        .nav-text:hover { color: var(--color-primary); }

        /* ---------- GOOEY PILL ---------- */
        .gooey-pill {
            position: absolute;
            width: var(--gooey-pill-size);
            height: var(--gooey-pill-size);
            background: linear-gradient(135deg, var(--gooey-primary), var(--gooey-primary-light));
            border-radius: 14px;
            z-index: 1; opacity: 0;
            transition: top 0.28s cubic-bezier(0.34, 1.2, 0.64, 1),
                        left 0.28s cubic-bezier(0.34, 1.2, 0.64, 1),
                        opacity 0.2s ease;
            pointer-events: none;
            box-shadow: 0 6px 14px rgba(200, 0, 10, 0.3);
            will-change: transform, top, left;
            transform-origin: center;
        }

        .gooey-pill.active { opacity: 1; }

        @keyframes gooeyStretch {
            0%   { transform: scale(1, 1);      border-radius: 14px; }
            35%  { transform: scale(0.7, 1.35); border-radius: 18px 12px 18px 12px; }
            70%  { transform: scale(1.05, 0.92); border-radius: 12px 18px 12px 18px; }
            100% { transform: scale(1, 1);      border-radius: 14px; }
        }

        .pill-animate {
            animation: gooeyStretch 0.3s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }

        /* ---------- GRID DE ICONES ---------- */
        .icons-grid-container {
            position: absolute;
            top: calc(var(--navbar-height) + 40px);
            left: var(--icon-grid-left);
            width: var(--icon-grid-width);
            z-index: 10;
            display: flex; flex-direction: column;
            align-items: center; text-align: center;
            height: calc(100% - var(--navbar-height) - 80px);
            justify-content: center;
            pointer-events: none;
        }

        .icons-grid-container > * { pointer-events: auto; }

        .icons-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: var(--icon-grid-gap-x);
            row-gap: var(--icon-grid-gap-y);
            justify-items: center;
            width: 100%;
        }

        .grid-icon-wrapper {
            display: flex; flex-direction: column; align-items: center;
        }

        .grid-icon-card {
            width: var(--card-size);
            height: var(--card-size);
            background: var(--color-card-bg);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--color-border);
            transition: transform 0.25s cubic-bezier(0.34, 1.3, 0.64, 1),
                        background-color 0.25s ease,
                        box-shadow 0.25s ease,
                        border-color 0.25s ease;
            cursor: pointer;
            box-sizing: border-box;
        }

        .grid-icon-card:hover {
            transform: scale(1.05);
            background: var(--color-primary);
            border-color: var(--color-primary);
            box-shadow: 0 8px 18px rgba(200, 0, 10, 0.28);
        }

        .grid-card-icon {
            color: var(--color-icon);
            font-size: 1.25rem;
            transition: color 0.25s ease;
        }

        .grid-icon-card:hover .grid-card-icon { color: #fff; }

        /* ---------- LABEL COM SHADOWS INTO LIGHT ---------- */
        .grid-card-label {
            font-family: 'Shadows Into Light', cursive;
            font-size: 1.25rem;
            color: var(--color-icon);
            margin-top: 4px;
            font-weight: 400;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -0.3px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: color 0.25s ease;
        }

        .grid-icon-wrapper:hover .grid-card-label { color: var(--color-primary); }

        /* ---------- PAINEL AVISOS ---------- */
        .avisos-panel {
            position: absolute; top: 80px; right: 38px;
            width: 330px; height: 260px;
            background-color: var(--color-bg-app);
            border-radius: 1rem;
            box-shadow: var(--shadow-panel);
            overflow: hidden;
            border: 1px solid var(--color-border);
            z-index: 20;
            display: flex; flex-direction: column;
            box-sizing: border-box;
        }

        .avisos-header {
            background-color: var(--color-primary);
            height: 40px; padding: 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            color: #fff; user-select: none; box-sizing: border-box;
        }

        .avisos-header-title-box { display: flex; align-items: center; gap: 8px; }

        .avisos-header-badge {
            width: 20px; height: 20px; border-radius: 50%;
            background-color: var(--color-white-translucent-20);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem;
        }

        .avisos-header-title { font-weight: 700; font-size: 0.875rem; }

        .avisos-header-dots { display: flex; align-items: center; gap: 6px; }

        .avisos-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: #fff; opacity: 0.9; display: inline-block;
        }

        .avisos-body {
            padding: 16px; flex: 1;
            position: relative; background-color: #fff;
            box-sizing: border-box;
        }

        .avisos-text {
            font-size: 0.75rem; color: var(--color-text-subtle);
            font-style: italic; margin: 0;
        }

        /* ---------- OVERLAY MOBILE ---------- */
        .mobile-overlay {
            display: none;
            position: fixed; inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 55;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mobile-overlay.active { display: block; opacity: 1; }

        /* ---------- RESPONSIVIDADE ---------- */
        @media screen and (max-width: 1024px) {
            .avisos-panel { width: 280px; right: 20px; }
        }

        @media screen and (max-width: 768px) {
            body {
                display: block; height: auto; min-height: 100vh;
                width: 100%; overflow-y: auto; overflow-x: hidden;
                align-items: initial; justify-content: initial;
            }

            .app-container {
                height: auto; min-height: 100vh; max-height: none;
                overflow: visible; box-shadow: none;
                padding-bottom: 40px;
            }

            .navbar { padding: 0 16px; z-index: 70; }
            .navbar-brand { gap: 8px; }
            .navbar-logo-badge { width: 28px; height: 28px; }
            .navbar-brain-icon { font-size: 1rem; }
            .navbar-title { font-size: 1rem; }
            .navbar-greeting-separator { font-size: 0.8rem; margin: 0 1px; }
            .navbar-greeting { font-size: 0.8rem; }

            .mobile-menu-wrapper { display: flex; padding: 16px 24px 0 24px; }
            .mobile-menu-btn { display: flex; }

            .sidebar-overlay { display: none; }

            .sidebar-drawer {
                position: fixed; top: 0; left: 0;
                transform: translateX(-100%);
                height: 100vh; max-height: none; width: 260px;
                border-radius: 0 20px 20px 0;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.2);
                padding: 32px 0;
                transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 60;
            }

            .sidebar-drawer:hover { width: 260px; }
            .sidebar-drawer.mobile-open { transform: translateX(0); }
            .sidebar-drawer .nav-text { opacity: 1; }

            .icons-grid-container {
                position: relative; top: auto; left: auto;
                width: 100%; padding: 16px 20px 20px 20px;
                margin-top: 0;
                display: flex; flex-direction: column; align-items: center;
                box-sizing: border-box; height: auto;
                justify-content: flex-start;
            }

            .icons-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                column-gap: 8px; row-gap: 16px;
                width: 100%; justify-items: center;
            }

            .grid-icon-wrapper { grid-column: auto; }
            .grid-icon-wrapper:nth-child(odd),
            .grid-icon-wrapper:nth-child(even) { grid-column: auto; }

            .grid-icon-card { width: 56px; height: 56px; border-radius: 14px; }
            .grid-card-icon { font-size: 1rem; }

            /* Labels no mobile com Shadows Into Light */
            .grid-card-label {
                font-size: 1rem;
                letter-spacing: 0;
            }

            .avisos-panel {
                position: relative; top: auto; right: auto;
                width: calc(100% - 48px);
                margin: 20px auto 0; height: 200px;
            }
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .lucide { width: 1.25rem; height: 1.25rem; stroke-width: 2; }
        .nav-icon-box .lucide { width: 1.35rem; height: 1.35rem; }
        .grid-card-icon .lucide { width: 1.5rem; height: 1.5rem; }
    </style>
</head>

<div class="app-container" id="appContainer">

    <header class="navbar">
        <div class="navbar-brand">
            <div class="navbar-logo-badge">

</div>

<script>
    lucide.createIcons();

    (function() {
        // ---------- SFX SYSTEM ----------
        let sfxEnabled = true;
        let sfxReady = false;
        const audioCache = {};

        const audioUrls = {
            hover: 'https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780092968/arnav_geddada-ui-sound-2-374229_gh19tt.mp3',
            click: 'https://res.cloudinary.com/dbwqwgbtx/video/upload/v1780071236/zapsplat_multimedia_beep_soft_click_button_87548_a99mcv.mp3'
        };

        function preloadAudio() {
            let loaded = 0;
            const total = Object.keys(audioUrls).length;
            for (const [key, url] of Object.entries(audioUrls)) {
                const audio = new Audio(url);
                audio.volume = 0.4;
                audio.addEventListener('canplaythrough', () => {
                    loaded++;
                    if (loaded === total) sfxReady = true;
                });
                audio.addEventListener('error', () => {
                    console.warn(`Erro ao carregar áudio: ${key}`);
                    loaded++;
                    if (loaded === total) sfxReady = true;
                });
                audioCache[key] = audio;
            }
        }

        function playSFX(type, volume = 0.3) {
            if (!sfxEnabled || !sfxReady || !audioCache[type]) return;
            const a = audioCache[type];
            a.currentTime = 0;
            a.volume = volume;
            a.play().catch(e => {});
        }

        preloadAudio();

        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        if (soundToggleBtn) {
            soundToggleBtn.addEventListener('click', () => {
                sfxEnabled = !sfxEnabled;
                soundToggleBtn.classList.toggle('muted', !sfxEnabled);
                playSFX('click', 0.3);
            });
        }

        // ---------- ELEMENTOS ----------
        const sidebarDrawer = document.getElementById('sidebarDrawer');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const mobileMenuBtn = document.getElementById('mobile-menu-toggle');
        const mobileOverlay = document.getElementById('mobileOverlay');

        const pill = document.createElement('div');
        pill.className = 'gooey-pill';
        sidebarDrawer.appendChild(pill);

        const navItems = document.querySelectorAll('.nav-item');
        let activeIndex = -1;
        let animationTimeout = null;

        function clearPillHover() {
            navItems.forEach(item => item.classList.remove('pill-hover'));
        }

        function updatePillPosition(index, triggerAnimation = true) {
            if (index < 0 || index >= navItems.length) return;
            const targetItem = navItems[index];
            const iconBox = targetItem.querySelector('.nav-icon-box');
            if (!iconBox) return;

            const itemRect = targetItem.getBoundingClientRect();
            const iconRect = iconBox.getBoundingClientRect();
            const drawerRect = sidebarDrawer.getBoundingClientRect();

            const pillSize = 46;
            const relativeTop = itemRect.top - drawerRect.top;
            const pillTop = relativeTop + (itemRect.height - pillSize) / 2;
            const iconCenterX = iconRect.left - drawerRect.left + (iconRect.width / 2);
            const pillLeft = iconCenterX - (pillSize / 2);

            pill.style.top = pillTop + 'px';
            pill.style.left = pillLeft + 'px';

            if (!pill.classList.contains('active')) pill.classList.add('active');

            clearPillHover();
            targetItem.classList.add('pill-hover');

            if (triggerAnimation) {
                pill.classList.remove('pill-animate');
                void pill.offsetWidth;
                pill.classList.add('pill-animate');

                if (animationTimeout) clearTimeout(animationTimeout);
                animationTimeout = setTimeout(() => {
                    pill.classList.remove('pill-animate');
                }, 320);
            }
        }

        function hidePill() {
            pill.classList.remove('active');
            clearPillHover();
            activeIndex = -1;
        }

        function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        // ---------- HOVER NOS NAV ITEMS ----------
        navItems.forEach((item, idx) => {
            item.addEventListener('mouseenter', () => {
                if (isMobile()) return;
                activeIndex = idx;
                updatePillPosition(idx, true);
                playSFX('hover', 0.2);
            });
        });

        // ---------- OVERLAY DESKTOP ----------
        function showSidebarOverlay() {
            if (isMobile()) return;
            sidebarOverlay.classList.add('active');
        }
        function hideSidebarOverlay() {
            if (isMobile()) return;
            sidebarOverlay.classList.remove('active');
        }

        sidebarDrawer.addEventListener('mouseenter', () => {
            if (isMobile()) return;
            showSidebarOverlay();
        });

        sidebarDrawer.addEventListener('mouseleave', () => {
            if (isMobile()) return;
            hidePill();
            hideSidebarOverlay();
        });

        sidebarOverlay.addEventListener('click', () => {
            hidePill();
            hideSidebarOverlay();
        });

        sidebarDrawer.addEventListener('transitionend', (e) => {
            if (isMobile()) return;
            if (e.propertyName === 'width' && activeIndex !== -1 && pill.classList.contains('active')) {
                updatePillPosition(activeIndex, false);
            }
        });

        let resizeTimeout;
        window.addEventListener('resize', () => {
            if (isMobile()) return;
            if (activeIndex !== -1 && pill.classList.contains('active')) {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    updatePillPosition(activeIndex, false);
                }, 100);
            }
        });

        // ---------- SIDEBAR MOBILE ----------
        function openMobileSidebar() {
            sidebarDrawer.classList.add('mobile-open');
            mobileOverlay.classList.add('active');
            playSFX('click');
        }

        function closeMobileSidebar() {
            sidebarDrawer.classList.remove('mobile-open');
            mobileOverlay.classList.remove('active');
        }

        mobileMenuBtn.addEventListener('click', openMobileSidebar);
        mobileOverlay.addEventListener('click', closeMobileSidebar);

        // ---------- SFX ÍCONES CENTRAIS ----------
        const mainIconCards = document.querySelectorAll('.grid-icon-card');
        mainIconCards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                if (isMobile()) return;
                playSFX('hover', 0.2);
            });
            card.addEventListener('click', () => {
                playSFX('click', 0.35);
                const href = card.getAttribute('data-href');
                if (href && href !== '#') window.location.href = href;
            });
        });

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                if (isMobile()) playSFX('click', 0.35);
            });
        });
    })();
</script>
</body>
</html>
