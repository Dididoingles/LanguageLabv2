<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Login | Language Lab</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --red: #c20000;
    --dark: #050505;
    --gray: #888;
    --light: #eaeaea;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 30% 20%, #2a0000 0%, #050505 60%, #000 100%);
    font-family: 'Poppins', sans-serif;
    color: white;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(194,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(194,0,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(20,20,20,0.85);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(194,0,0,0.25);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    animation: fadeUp 0.6s cubic-bezier(0.23,1,0.32,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .brand {
    text-align: center;
    margin-bottom: 2rem;
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border: 2px solid var(--red);
    border-radius: 50%;
    margin-bottom: 1rem;
    position: relative;
  }

  .brand-mark::after {
    content: '';
    position: absolute;
    inset: -6px;
    border: 1px solid rgba(194,0,0,0.3);
    border-radius: 50%;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50%      { transform: scale(1.12); opacity: 0.15; }
  }

  .brand-mark svg {
    width: 26px;
    height: 26px;
    color: var(--red);
  }

  .brand h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
  }

  .brand h1 span { color: var(--red); }

  .brand p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1.5rem 0;
    color: var(--gray);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(194,0,0,0.4), transparent);
  }

  #g_id_onload { display: none; }

  .g_id_signin {
    display: flex;
    justify-content: center;
    margin: 1rem 0;
  }

  .status {
    min-height: 60px;
    padding: 0.85rem 1rem;
    border-radius: 12px;
    font-size: 0.8rem;
    line-height: 1.5;
    text-align: center;
    border: 1px solid transparent;
  }

  .status.idle {
    background: rgba(255,255,255,0.02);
    border-color: rgba(255,255,255,0.06);
    color: var(--gray);
  }

  .status.loading {
    background: rgba(194,0,0,0.08);
    border-color: rgba(194,0,0,0.3);
    color: var(--light);
  }

  .status.error {
    background: rgba(194,0,0,0.15);
    border-color: rgba(194,0,0,0.5);
    color: #ffb3b3;
  }

  .status.success {
    background: rgba(0,180,80,0.1);
    border-color: rgba(0,180,80,0.4);
    color: #9effc0;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(194,0,0,0.3);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .footer-note {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.7rem;
    color: var(--gray);
    line-height: 1.5;
  }

  .footer-note strong { color: var(--light); font-weight: 600; }

  .hud {
    position: fixed;
    width: 32px;
    height: 32px;
    border-color: var(--red);
    z-index: 5;
    opacity: 0.6;
  }
  .hud.tl { top: 20px; left: 20px; border-top: 2px solid; border-left: 2px solid; }
  .hud.tr { top: 20px; right: 20px; border-top: 2px solid; border-right: 2px solid; }
  .hud.bl { bottom: 20px; left: 20px; border-bottom: 2px solid; border-left: 2px solid; }
  .hud.br { bottom: 20px; right: 20px; border-bottom: 2px solid; border-right: 2px solid; }

  /* Esconde os brackets no celular */
  @media (max-width: 640px) {
    .hud { display: none; }
  }
</style>
</head>
<body>

  <div class="hud tl"></div>
  <div class="hud tr"></div>
  <div class="hud bl"></div>
  <div class="hud br"></div>

  <div class="wrap">
    <div class="card">

      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1>Language <span>Lab</span></h1>
        <p>Acesso Restrito</p>
      </div>

      <div id="status" class="status idle">
        Faça login com sua conta Google para continuar.
      </div>

      <div class="divider">IDENTIFICAÇÃO</div>

      <div id="g_id_onload"
           data-client_id="292714518504-bm1on42mdeevgrfl15ke3bua8uo49m68.apps.googleusercontent.com"
           data-callback="handleGoogleLogin"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-shape="pill"
           data-theme="filled_black"
           data-text="signin_with"
           data-size="large"
           data-logo_alignment="left"
           data-width="300">
      </div>

      <div class="footer-note">
        Use a conta Google cadastrada com o <strong>professor</strong>.
      </div>

    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYuIulPmjwgggsoOZbw8wFC3JQuZ0JknOwbWc-gShRFY3IduFwgOAwL2soSRzHjcrv/exec';

    const statusEl = document.getElementById('status');

    function setStatus(type, html) {
      statusEl.className = 'status ' + type;
      statusEl.innerHTML = html;
    }

    async function handleGoogleLogin(response) {
      const idToken = response.credential;
      if (!idToken) {
        setStatus('error', 'Falha ao obter credenciais do Google.');
        return;
      }

      setStatus('loading', '<span class="spinner"></span> Validando acesso...');

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'login',
            credential: idToken
          })
        });

        const data = await res.json();

        if (!data.authorized) {
          const reason = data.reason || 'Acesso não autorizado.';
          const email = data.email ? '<br><small>' + data.email + '</small>' : '';
          setStatus('error', reason + email);
          return;
        }

        setStatus('success', 'Bem-vindo, <strong>' + data.user.name + '</strong>!');

        sessionStorage.setItem('ll_auth', JSON.stringify({
          token: data.sessionToken,
          user: data.user,
          expiresAt: Date.now() + (data.expiresIn * 1000)
        }));

        setTimeout(() => {
          setStatus('success', 'Redirecionando para o app...');
        }, 800);

      } catch (err) {
        console.error(err);
        setStatus('error', 'Erro de conexão. Tente novamente.');
      }
    }

    window.handleGoogleLogin = handleGoogleLogin;
  </script>

</body>
</html>
